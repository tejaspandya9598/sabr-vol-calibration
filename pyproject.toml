[project]
name = "sabr-vol-calibration"
version = "0.2.0"
description = "SABR stochastic-volatility model: Hagan implied-vol approximation and least-squares calibration of a volatility smile to market quotes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tejas Pandya", email = "tbp8777@nyu.edu" }]
license = { text = "MIT" }
keywords = ["sabr", "stochastic-volatility", "implied-volatility", "calibration", "options", "quant"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Only the live demo needs these: sabr.data (Deribit public API) and sabr.viz (plots).
demo = [
    "matplotlib>=3.8",
    "requests>=2.31",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv.build-backend]
module-name = "sabr"

[tool.ruff]
line-length = 110
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "N803", "N806"]
